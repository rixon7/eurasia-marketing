<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 50">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0088e9"/>
      <stop offset="100%" style="stop-color:#00b4d8"/>
    </linearGradient>
  </defs>

  <!-- Globe icon -->
  <circle cx="25" cy="25" r="20" fill="none" stroke="url(#grad)" stroke-width="2.5"/>
  <ellipse cx="25" cy="25" rx="20" ry="8" fill="none" stroke="url(#grad)" stroke-width="1.5"/>
  <ellipse cx="25" cy="25" rx="8" ry="20" fill="none" stroke="url(#grad)" stroke-width="1.5"/>
  <!-- Arrow pointing up-right -->
  <line x1="25" y1="25" x2="39" y2="11" stroke="#0088e9" stroke-width="2.5" stroke-linecap="round"/>
  <polyline points="33,10 39.5,10.5 39,17" fill="none" stroke="#0088e9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Company name -->
  <text x="55" y="22" font-family="DM Sans, Inter, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#1d322d" letter-spacing="-0.5">Eurasia</text>

  <!-- Dot accent -->
  <circle cx="152" cy="21" r="3" fill="#0088e9"/>

  <!-- Tagline -->
  <text x="55" y="40" font-family="DM Mono, monospace" font-size="10" font-weight="500" fill="#7a8a85" letter-spacing="3.5">MARKETING</text>
</svg>
