<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 50">
  <!-- Violet badge behind the globe icon -->
  <circle cx="25" cy="25" r="22" fill="#7c6cf6"/>

  <!-- Globe icon -->
  <circle cx="25" cy="25" r="20" fill="none" stroke="#f3f3f6" stroke-width="2.5"/>
  <ellipse cx="25" cy="25" rx="20" ry="8" fill="none" stroke="#f3f3f6" stroke-width="1.5"/>
  <ellipse cx="25" cy="25" rx="8" ry="20" fill="none" stroke="#f3f3f6" stroke-width="1.5"/>
  <!-- Arrow pointing up-right -->
  <line x1="25" y1="25" x2="39" y2="11" stroke="#f3f3f6" stroke-width="2.5" stroke-linecap="round"/>
  <polyline points="33,10 39.5,10.5 39,17" fill="none" stroke="#f3f3f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Company name -->
  <text x="55" y="22" font-family="DM Sans, Inter, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#f3f3f6" letter-spacing="-0.5">Eurasia</text>

  <!-- Dot accent -->
  <circle cx="152" cy="21" r="3" fill="#7c6cf6"/>

  <!-- Tagline -->
  <text x="55" y="40" font-family="DM Mono, monospace" font-size="10" font-weight="500" fill="#f3f3f6" letter-spacing="3.5">MARKETING</text>
</svg>
